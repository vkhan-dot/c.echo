<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" width="250" height="48" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E50012"/>
      <stop offset="40%"  stop-color="#8A005A"/>
      <stop offset="100%" stop-color="#0033A0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g transform="translate(8, 9)" filter="url(#shadow)">
    <!-- Speaker cabinet -->
    <rect x="0" y="6" width="14" height="18" rx="3.5" fill="url(#g)"/>
    <!-- Grille lines — suggest speaker fabric / waveform -->
    <line x1="3"  y1="11" x2="11" y2="11" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="3"  y1="15" x2="11" y2="15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="3"  y1="19" x2="11" y2="19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
    <!-- Horn -->
    <path d="M14 10 L20 7 L20 23 L14 20Z" fill="url(#g)"/>
    <!-- Echo wave 1 — nearest, bold -->
    <path d="M23 12 C24.5 13.5 24.5 16.5 23 18"
          stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Echo wave 2 -->
    <path d="M27 10 C30 12.5 30 17.5 27 20"
          stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75"/>
    <!-- Echo wave 3 — farthest, thin -->
    <path d="M31 8 C35 11.5 35 18.5 31 22"
          stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.45"/>
  </g>

  <!-- Wordmark -->
  <text x="52" y="32" font-family="'Outfit', 'Inter', sans-serif" font-size="22" letter-spacing="0.020em">
    <tspan font-weight="900" fill="url(#g)">centras</tspan>
    <tspan font-weight="600" fill="#8A005A" fill-opacity="0.95" dx="5">·</tspan>
    <tspan font-weight="500" fill="#0033A0" dx="4">echo</tspan>
  </text>
</svg>
